<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="ZuneFit" />
  <meta name="theme-color" content="#000000" />
  <title>ZuneFit // Metro Workout Log</title>
  <style>
    :root {
      --bg: #000000;
      --card: #111111;
      --card-elevated: #191919;
      --border: #262626;
      --text-primary: #ffffff;
      --text-secondary: #999999;
      --text-muted: #555555;
      --zune-pink: #ec008c;
      --zune-orange: #f26522;
      --zune-gradient: linear-gradient(135deg, #ec008c 0%, #f26522 100%);
      --wp-cyan: #008299;
      --font-metro: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: text;
      font-family: var(--font-metro);
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: -webkit-fill-available;
      height: 100dvh;
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-metro);
      overflow: hidden;
      position: fixed;
      inset: 0;
    }

    #appShell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      background: var(--bg);
    }

    /* Top Metro Header */
    .metro-header {
      padding: 10px 18px 0 18px;
      flex-shrink: 0;
      background: #000;
      z-index: 20;
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .brand-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #cccccc;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .zune-glyph {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--zune-gradient);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timer-pill-btn {
      background: #141414;
      border: 1px solid #2b2b2b;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .timer-pill-btn.running {
      border-color: var(--zune-pink);
      color: var(--zune-pink);
    }

    /* Pivot Title Strip */
    .pivot-strip {
      display: flex;
      gap: 22px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
    }
    .pivot-strip::-webkit-scrollbar { display: none; }

    .pivot-tab {
      font-size: 36px;
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.18s ease;
    }

    .pivot-tab.active {
      color: var(--text-primary);
      font-weight: 300;
    }

    /* FitNotes-style Day Navigation Strip */
    .day-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 18px;
      border-top: 1px solid #1b1b1b;
      border-bottom: 1px solid #1b1b1b;
      background: #070707;
      flex-shrink: 0;
    }

    .day-arrow {
      background: none;
      border: none;
      color: var(--zune-pink);
      font-size: 26px;
      font-weight: 300;
      line-height: 1;
      padding: 2px 10px;
      cursor: pointer;
    }

    .day-title-wrap {
      text-align: center;
      cursor: pointer;
    }

    .day-title {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: #fff;
    }

    .day-subtitle {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    /* Collapsible Rest Timer Drawer */
    .rest-drawer {
      background: #121212;
      border-bottom: 1px solid #2c2c2c;
      padding: 8px 18px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .rest-drawer.open {
      display: flex;
    }

    .rest-clock {
      font-size: 20px;
      font-weight: 300;
      color: var(--zune-pink);
      font-variant-numeric: tabular-nums;
    }

    /* Panes Viewport */
    .panes-container {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    .pane {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px 18px 96px 18px;
      display: none;
    }

    .pane.active {
      display: block;
    }

    /* Clean FitNotes Empty Day State in Zune Metro Style */
    .empty-day-stage {
      min-height: calc(100% - 16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
      padding: 20px 0;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .empty-action-btn {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
